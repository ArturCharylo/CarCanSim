apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-app
  labels:
    app: telemetry-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-app
  template:
    metadata:
      labels:
        app: telemetry-app
    spec:
      containers:
        - name: telemetry-app
          image: telemetry-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: PROMETHEUS_ENDPOINT
              value: "http://prometheus:9090"
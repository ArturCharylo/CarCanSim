services:
  # The main Rust telemetry generator application
  telemetry-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - telemetry-network
    restart: unless-stopped

  # Prometheus for metrics scraping and aggregation
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - telemetry-network
    depends_on:
      - telemetry-app
    restart: unless-stopped

  # Grafana for real-time observability and dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - telemetry-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  # Custom bridge network to allow services to communicate via hostname
  telemetry-network:
    driver: bridge
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
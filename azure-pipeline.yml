trigger:
  - main

pool:
  name: 'Default'

variables:
  - group: carcansim-variables
  - name: SERVICE_CONNECTION
    value: 'sc-azure-carcansim'
  - name: CLUSTER_NAME
    value: 'carcansim-cluster'
  - name: ACR_NAME
    value: 'acrcarcansimartur123'
  - name: APP_NAME
    value: 'app-carcansim'
  - name: RESOURCE_GROUP
    value: 'rg-carcansim'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'
  - name: FULL_IMAGE_NAME
    value: '$(ACR_NAME).azurecr.io/carcansim'

stages:
  # Stage 1: tests & build
  - stage: LocalTestAndBuild
    displayName: 'Local Test and Build'
    jobs:
      - job: TestAndBuild
        displayName: 'Run Tests and Build Docker Image'
        steps:
          - powershell: |
              docker build `
                -t telemetry-app:latest `
                -t $(FULL_IMAGE_NAME):$(IMAGE_TAG) `
                -t $(FULL_IMAGE_NAME):latest .
            displayName: 'Build Telemetry App via Docker'

          - powershell: |
              kind load docker-image telemetry-app:latest --name $(CLUSTER_NAME)
            displayName: 'Deploy to Local Kind Cluster and Verify Rollout'

  # Stage 2: Deploy to Azure (ACR + ACA)
  - stage: DeployToAzure
    displayName: 'Deploy to Azure'
    dependsOn: LocalTestAndBuild
    condition: succeeded()
    jobs:
      - job: DeployToAzure
        displayName: 'Push to ACR and Update ACA'
        steps:
          - task: AzureCLI@2
            displayName: 'Push Docker Image & Update Container App'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Authenticate docker client with ACR using Azure CLI credentials
                az acr login --name $(ACR_NAME)

                # Push pre-built tags from local daemon
                docker push $(FULL_IMAGE_NAME):$(IMAGE_TAG)
                docker push $(FULL_IMAGE_NAME):latest

                # Update Azure Container App revision to roll out the new image
                az containerapp update `
                  --name $(APP_NAME) `
                  --resource-group $(RESOURCE_GROUP) `
                  --image $(FULL_IMAGE_NAME):$(IMAGE_TAG)
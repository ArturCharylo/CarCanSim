trigger:
  - main

pool:
  name: 'Default'

# Azure resource group must be created for stage 3 to succeed.
# This is a flag for the pipeline to pass omitting stage 3 to avoid unnecessary costs from Azure ACR.
parameters:
  - name: deployToAzure
    displayName: 'Deploy to Azure cloud?'
    type: boolean
    default: false

variables:
  - group: carcansim-variables
  - name: CLUSTER_NAME
    value: 'carcansim-cluster'
  - name: ACR_NAME
    value: 'acrcarcansimartur123'
  - name: APP_NAME
    value: 'app-carcansim'
  - name: RESOURCE_GROUP
    value: 'rg-carcansim'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
  # Stage 1: tests & build
  - stage: LocalTestAndBuild
    displayName: 'Local Test and Build'
    jobs:
      - job: TestAndBuild
        displayName: 'Run Tests and Build Docker Image'
        steps:
          - script: |
              docker build -t telemetry-app:latest .
            displayName: 'Build Telemetry App via Docker'
          - script: |
              kind load docker-image telemetry-app:latest --name $(CLUSTER_NAME)
            displayName: 'Deploy to Local Kind Cluster and Verify Rollout'

  # Stage 2: Sync Repositories (Only runs after PR merge / direct push to main)
  - stage: SyncRepos
    displayName: 'Sync Repositories'
    dependsOn: LocalTestAndBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: SyncRepos
        displayName: 'Push Mirror to Gitea and Azure Repos'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - powershell: |
              # Update or create gitea remote
              $giteaUrl = "http://${env:GITEA_TOKEN}@gitea.local/artur/carcansim.git"

              if (git remote | Select-String "gitea") {
                  git remote set-url gitea $giteaUrl
              } else {
                  git remote add gitea $giteaUrl
              }
              
              git push --force gitea HEAD:main
            displayName: 'Push to Gitea'
            env:
              GITEA_TOKEN: $(GITEA_TOKEN)

          - powershell: |
              # Update or create Azure DevOps remote
              $azUrl = "https://${env:AZURE_TOKEN}@dev.azure.com/arturcha/CarCanSim/_git/CarCanSim"
              
              if (git remote | Select-String "az") {
                  git remote set-url az $azUrl
              } else {
                  git remote add az $azUrl
              }
              
              git push --force az HEAD:main
            displayName: 'Push to Azure DevOps'
            env:
              AZURE_TOKEN: $(AZURE_TOKEN)

  # Stage 3: Deploy to Azure (ACR + ACA)
  - stage: DeployToAzure
    displayName: 'Deploy to Azure'
    dependsOn: LocalTestAndBuild
    condition: and(succeeded(), eq('${{ parameters.deployToAzure }}', 'true'))
    jobs:
      - job: DeployToAzure
        displayName: 'Push to ACR and Update ACA'
        steps:
          - powershell: |
              docker build -t $(ACR_NAME).azurecr.io/carcansim:$(IMAGE_TAG) -t $(ACR_NAME).azurecr.io/carcansim:latest .
            displayName: 'Build Docker Image for Azure'

          - powershell: |
              az login --service-principal -u "$env:AZURE_CLIENT_ID" -p "$env:AZURE_CLIENT_SECRET" --tenant "$env:AZURE_TENANT_ID"
              az acr login --name $(ACR_NAME)
              docker push $(ACR_NAME).azurecr.io/carcansim:$(IMAGE_TAG)
              docker push $(ACR_NAME).azurecr.io/carcansim:latest
            displayName: 'Login to ACR & Push Docker Image'
            env:
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)

          - powershell: |
              az login --service-principal -u "$env:AZURE_CLIENT_ID" -p "$env:AZURE_CLIENT_SECRET" --tenant "$env:AZURE_TENANT_ID"
              az containerapp update `
                --name $(APP_NAME) `
                --resource-group $(RESOURCE_GROUP) `
                --image $(ACR_NAME).azurecr.io/carcansim:$(IMAGE_TAG)
            displayName: 'Update Azure Container App Revision'
            env:
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)